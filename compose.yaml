services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume-screening-engine
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=resumedb
      - DB_USER=resume_user
      - DB_PASSWORD=resume_password
      - APP_JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    volumes:
      - resume-storage:/app/storage/resumes
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    container_name: resume-screening-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: resumedb
      POSTGRES_USER: resume_user
      POSTGRES_PASSWORD: resume_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume_user -d resumedb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  resume-storage:
